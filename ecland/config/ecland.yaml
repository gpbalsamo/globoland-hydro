# ecLand global-run configuration.
#
# NOT VERIFIED against an actual run yet -- values below are placeholders /
# carried over from liaise-ecland where the concept transfers, and must be
# confirmed against the target ecLand build before the first pilot. See
# PLAN.md Milestone 2-3.

grid:
  representation: regular_latlon   # or reduced_gaussian -- see init_clim.py's
                                    # gen_file vs gen_file_LL; must match
                                    # whatever grid the forcing/surfclim/soilinit
                                    # actually share (validate_init_grid.py)
  resolution_deg: 0.5              # matches the WFDE5 native grid; do not
                                    # interpolate runoff generation to a finer
                                    # grid than this, see CLAUDE.md invariants

executable: ${ECLAND_EXE}          # env var; no machine-specific path in git
namelist_template: namelist/templates/  # filled in once Milestone 2 exists

# CaMa-Flood 1-way coupling, if enabled: TCOUPFREQ drives CaMa-Flood's own
# IFRQ_INP/DROFUNIT/DT (all three, kept in lock-step -- see
# docs/migration_from_liaise.md and liaise-ecland/CLAUDE.md for the
# DTIN-must-be-a-multiple-of-DT constraint this satisfies automatically).
coupling:
  enabled: false
  tcoupfreq_hours: 24

threading:
  # Measured in liaise-ecland (2026-09-17): threading is NOT a universal win.
  # 1.6x SLOWER at ~1,400 active river cells (glb_15min); ~1.4-2x FASTER at
  # ~34,000 cells (glb_03min). A global run's cell count depends entirely on
  # the CaMa-Flood resolution chosen -- do not assume more threads helps
  # without measuring at the actual chosen resolution.
  omp_threads: 1   # override explicitly per experiment once measured
